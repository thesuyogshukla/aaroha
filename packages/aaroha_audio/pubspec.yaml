name: aaroha_audio
description: Aaroha native audio core (miniaudio, pitch tracker, drone) and its Dart bindings.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  aaroha_core:
    path: ../aaroha_core

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
